  <style>
    :root {
      color-scheme: dark;
      --fg: #fff;
      --muted: #c9c9c9;
      --accent: #25d366;
      --page-pad: clamp(10px, 2.4svh, 24px);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { background:#000; margin:0; }
    body {
      margin:0;
      background:#000;
      color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      min-height:100svh;
      display:flex;
      justify-content:center;
      -webkit-text-size-adjust:100%;
    }
    .page {
      width:min(100%, 450px);
      min-height:100svh;
      min-height:100dvh;
      margin:0 auto;
      padding:var(--page-pad) clamp(16px, 4vw, 26px) max(var(--page-pad), env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      align-items:stretch;
      justify-content:space-evenly;
      gap:clamp(5px, 1svh, 11px);
      text-align:center;
    }
    .brand { display:flex; flex-direction:column; align-items:center; }
    .logo {
      display:block;
      width:min(100%, 390px);
      height:auto;
      margin:0 auto;
      /* Real SmooKiss artwork, pixel-identical crop from the supplied image. */
    }
    .address {
      margin:clamp(0px, .45svh, 5px) 0 0;
      font-size:clamp(10px, 2.8vw, 12px);
      line-height:1.15;
      color:#d5d5d5;
      letter-spacing:.04em;
    }
    .intro h1 {
      font-size:clamp(20px, 5.2vw, 24px);
      line-height:1.13;
      font-weight:650;
      letter-spacing:-.02em;
      margin:0 auto 6px;
      max-width:100%;
      display:table;
      border-bottom:1px solid rgba(255,255,255,.74);
      padding-bottom:5px;
    }
    .tag {
      font-size:clamp(8px, 2.05vw, 10px);
      font-weight:650;
      line-height:1.35;
      letter-spacing:.16em;
      color:#bdbdbd;
    }
    .links {
      display:flex;
      flex-direction:column;
      gap:clamp(6px, 1.05svh, 10px);
    }
    .social {
      display:flex;
      align-items:center;
      width:100%;
      height:clamp(52px, 8.3svh, 66px);
      padding:6px clamp(12px, 3.3vw, 17px);
      gap:clamp(10px, 2.8vw, 14px);
      margin:0;
      border:1.3px solid #fff;
      border-radius:999px;
      color:#fff;
      background:#000;
      text-decoration:none;
      text-align:left;
      font:inherit;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:background .14s,transform .14s;
    }
    .social:active { transform:scale(.99); background:#101010; }
    .social:focus-visible,.chatline a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    .icon {
      width:clamp(34px, 5.4svh, 42px);
      height:clamp(34px, 5.4svh, 42px);
      flex:0 0 auto;
      display:grid;
      place-items:center;
    }
    .icon svg { display:block; width:100%; height:100%; }
    .copy { flex:1; min-width:0; }
    .name {
      display:block;
      font-size:clamp(16px, 4.2vw, 19px);
      line-height:1.05;
      font-weight:750;
      letter-spacing:-.01em;
    }
    .action {
      display:block;
      margin-top:3px;
      font-size:clamp(8px, 2.1vw, 9px);
      font-weight:600;
      line-height:1.25;
      letter-spacing:.06em;
      color:#cfcfcf;
    }
    .arr { font-size:30px; font-weight:300; line-height:1; flex-shrink:0; }
    .chatline {
      margin:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:3px;
      line-height:1.25;
      font-size:clamp(12px,3.1vw,14px);
      color:#bcbcbc;
    }
    .chatline a {
      color:var(--accent);
      font-size:clamp(13px,3.55vw,15px);
      font-weight:700;
      text-underline-offset:3px;
      text-decoration-thickness:1px;
    }
    @media (max-height:700px) {
      :root { --page-pad: 9px; }
      .page { gap:4px; }
      .logo { width:min(81%,340px); }
      .social { height:clamp(48px,8.2svh,58px); }
      .links { gap:5px; }
      .intro h1 { margin-bottom:3px; padding-bottom:3px; }
      .icon { width:34px; height:34px; }
    }
    @media (max-height:580px) {
      .logo { width:min(71%,296px); }
      .social { height:45px; }
      .icon { width:30px; height:30px; }
      .name { font-size:15px; }
      .action { font-size:8px; margin-top:2px; }
      .links { gap:4px; }
      .chatline { font-size:11px; }
      .chatline a { font-size:13px; }
    }
    @media (prefers-reduced-motion:reduce) {
      .social { transition:none; }
    }
  </style>
